server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root __DEPLOY_PATH__/current;
    index index.html;

    include /etc/nginx/conf.d/security-headers.conf;

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public" always;
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri =404;
    }

    location /images/ {
        expires 7d;
        add_header Cache-Control "public" always;
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /error/index.html;
}
